# Root city pack for the parlay city (Pack Spec 2.0).
#
# Deployment glue only: this manifest exists to import the parlay pack. All
# parlay definitions (agents, formulas, orders, commands, doctor checks) live
# in packs/parlay/ so the pack stays reusable and importable by binding into
# any other city, independent of this city.toml.
#
# Spec: ~/code/gascity/docs/reference/specs/pack-spec.md (schema 2).

[pack]
name = "parlay-city"
schema = 2
description = "Root city pack for the parlay city. Deployment glue; all parlay definitions live in packs/parlay."

# The binding name qualifies every agent the import contributes: an agent
# `X` defined in packs/parlay/agents/X/ has runtime name `parlay.X`
# (pack-spec §2.5). Address imported agents by the qualified name.
[imports.parlay]
source = "packs/parlay"

# Required builtin packs. The pinned gc warns ("does not import required
# builtin pack(s) core, bd") on any city whose composed config does not reach
# these; gc init writes the same imports with a `version = "sha:…"` pin copied
# from the installing binary. `version` is deliberately OMITTED here: for a
# recognized bundled source with no declared version, gc resolves the running
# binary's own embedded canonical pin from its synthetic cache — offline, and
# never skewed against whatever binary is actually running
# (config.resolveBundledSourceWithoutLock at the pinned ref). A committed sha
# would instead degrade to a network-only remote import the moment gc's
# canonical pin moves past it.
[imports.core]
source = "https://github.com/gastownhall/gascity/tree/main/internal/bootstrap/packs/core"

# bd is required because the city's beads provider defaults to "bd" when no
# [beads] table is declared (and city.toml deliberately declares none — Q4,
# task-4cfpv.20). If Q4 rules a non-bd provider in, drop this import with it.
[imports.bd]
source = "https://github.com/gastownhall/gascity/tree/main/examples/bd"
