# Builds the pinned Gas City `gc` from source (third_party/gascity/PIN) via
# the same recipe developers use (tools/gc-build/build-gc.sh), so a pin move
# or recipe change that no longer produces a working binary fails here instead
# of on someone's machine at spawn time. Path-filtered: gascity is a large
# module and this build is only evidence when the pin or recipe changes.
name: gc-build

on:
  pull_request:
    paths:
      - third_party/gascity/PIN
      - tools/gc-build/**
      - .github/workflows/gc-build.yml
  push:
    branches: [main]
    paths:
      - third_party/gascity/PIN
      - tools/gc-build/**
      - .github/workflows/gc-build.yml

permissions:
  contents: read

jobs:
  build-pinned-gc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # gascity's go.mod declares its own floor; GOTOOLCHAIN=auto (the
          # default) fetches the exact toolchain it asks for.
          go-version: stable
          cache: false
      - name: Build pinned gc via the documented recipe
        run: tools/gc-build/build-gc.sh --out "$RUNNER_TEMP/gc"
