name: CI

# Parlay's first CI. Before this, the only check on a pull request was
# CodeRabbit, which reports the check conclusion "pass" even when its
# account-wide rate limit meant it never reviewed the diff at all. A triage of
# the open-PR backlog found 23/23 PRs showing a green check while 3 were
# provably broken (committed conflict markers, a clean merge that broke main's
# build, and a 9.6 MB committed binary). Every one of those three is caught by
# a job below.

on:
  # No branch filter: contributions arrive from forks and long-lived branches.
  pull_request:
  push:
    branches: [main]

# Least privilege. Nothing here writes to the repo, comments on a PR, or
# publishes an artifact, so read access to the contents is the entire need.
#
# Deliberately NOT pull_request_target: this repo is about to go public and
# accept PRs from strangers. That trigger runs the workflow definition from the
# base branch but with a writable token and repository secrets in scope, while
# checking out untrusted code — the standard way public repos leak credentials.
# Everything below runs with the fork's read-only token and no secrets.
permissions:
  contents: read

# Pull-request runs are grouped by ref and a superseded one is cancelled: the
# newest commit on a branch is the only one whose answer matters, and there is
# no reason to keep burning a runner on an answer nobody will read.
#
# Push runs are deliberately given a group key unique per run (github.run_id),
# which puts each of them in a group of one. `cancel-in-progress: false` alone
# would not be enough: runs sharing a group key also evict each other while
# still *pending*, and every push to main shares refs/heads/main — so a burst of
# landings would silently drop the middle commits' runs before they ever start.
# A unique key is the only way no landed commit loses its verdict, which is the
# ambiguous-green state this workflow exists to remove.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Go: tools/cli, tools/relay, tools/parlay-bin, packages/eval-engine,
  #    packages/go-server ───────────────────────────────────────────────────
  # Five separate modules, no root go.work, so each is entered on its own.
  # All five are pure standard library (no go.sum, no external requires), which
  # is why the whole suite runs in seconds.
  go:
    name: Go (build, vet, test, gofmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The module list, consumed unquoted by gofmt/build/vet/test below so the
    # shell splits it on whitespace. It is shared across every step on purpose;
    # a per-step list would let one step drift and leave a module silently
    # unchecked.
    #
    # This list must equal `find . -name go.mod -not -path './node_modules/*'`,
    # and the "Every Go module is listed" step below enforces that rather than
    # trusting this comment. It is enforced because it already failed: the list
    # sat at five modules while the repo had six, so packages/spawn-profiles was
    # never built, vetted, tested or gofmt'd, and its main.go drifted out of
    # gofmt compliance without anything noticing. A green Go job proved nothing
    # about that module. Naming a count here is what went stale, so the check
    # derives the truth from the filesystem instead.
    env:
      GO_MODULES: tools/cli tools/relay tools/parlay-bin packages/eval-engine packages/go-server packages/spawn-profiles
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Matches the `go 1.26` directive every module declares.
          go-version: '1.26'
          # No module has a go.sum (zero external dependencies), so the cache
          # key is keyed off the go.mod files instead. The value here is the
          # build cache, not a download cache.
          cache-dependency-path: |
            tools/cli/go.mod
            tools/relay/go.mod
            tools/parlay-bin/go.mod
            packages/eval-engine/go.mod
            packages/go-server/go.mod
            packages/spawn-profiles/go.mod

      # Pin the Go cache/GOPATH locations as explicit environment variables
      # BEFORE any step redirects HOME. Go derives GOCACHE and GOMODCACHE from
      # $HOME by default, so without this the HOME redirect below would silently
      # move them to an empty directory and discard the cache restored above.
      - name: Pin Go cache paths against the HOME redirect
        run: |
          {
            echo "GOCACHE=$(go env GOCACHE)"
            echo "GOMODCACHE=$(go env GOMODCACHE)"
            echo "GOPATH=$(go env GOPATH)"
          } >> "$GITHUB_ENV"

      # Every step below iterates GO_MODULES, so a module missing from that list
      # is not partially checked — it is not checked at all, and the job still
      # reports green. That is indistinguishable from a module that passed, which
      # is why this compares the list against the filesystem before anything runs.
      #
      # Deliberately fails on a module present on disk but absent from the list.
      # The reverse (listed but deleted) already fails loudly at the build step.
      - name: Every Go module is listed in GO_MODULES
        # Named explicitly: the comparison uses process substitution, which is a
        # bash feature. Relying on the runner's default shell staying bash would
        # make this step's correctness depend on something outside the file.
        shell: bash
        run: |
          set -euo pipefail
          on_disk="$(find . -name go.mod -not -path './node_modules/*' -not -path './.git/*' \
            -exec dirname {} \; | sed 's|^\./||' | sort)"
          listed="$(printf '%s\n' $GO_MODULES | sort)"
          missing="$(comm -23 <(printf '%s\n' "$on_disk") <(printf '%s\n' "$listed"))"
          if [ -n "$missing" ]; then
            echo "::error::Go modules exist on disk but are absent from GO_MODULES in this workflow."
            echo "::error::Every build/vet/test/gofmt step iterates that list, so these are UNCHECKED:"
            printf '  %s\n' $missing
            echo "Add them to GO_MODULES and to cache-dependency-path above."
            exit 1
          fi
          echo "All $(printf '%s\n' "$on_disk" | wc -l | tr -d ' ') Go modules on disk are listed."

      # gofmt across every module.
      #
      # tools/cli already guards itself with TestGofmtClean
      # (tools/cli/internal/commands/gofmt_test.go), which runs as part of
      # `go test` below — but that test resolves its root to the tools/cli
      # module and therefore covers exactly one of the five modules. This step
      # is what covers the other four; it is not a duplicate of that guard, it
      # is the other 80%.
      - name: gofmt
        run: |
          dirty="$(gofmt -l $GO_MODULES)"
          if [ -n "$dirty" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$dirty"
            echo "Inspect with 'gofmt -d <file>' before running 'gofmt -w': gofmt"
            echo "reformats doc comments and can rewrite documented prose."
            exit 1
          fi
          echo "all five modules are gofmt-clean"

      - name: Build
        run: |
          for m in $GO_MODULES; do
            echo "::group::go build ./... ($m)"
            ( cd "$m" && go build ./... )
            echo "::endgroup::"
          done

      - name: Vet
        run: |
          for m in $GO_MODULES; do
            echo "::group::go vet ./... ($m)"
            ( cd "$m" && go vet ./... )
            echo "::endgroup::"
          done

      # HOME is redirected for the test run. Several Go tests write under
      # $HOME (observed: ~/.parlay, ~/.config/bd, ~/.beads) because the code
      # they cover resolves ~/.parlay/agents directly rather than honouring
      # $PARLAY_AGENT_HOME — see the AGENTS.md notes on guard/teardown/variant
      # and on the ~/.parlay/agents/status-agent pollution incident. On a
      # hosted runner $HOME is thrown away with the VM, but this workflow must
      # also be safe on a self-hosted runner, where $HOME persists and is a
      # real developer's state. AGENTS.md records a smoke test permanently
      # deleting a live ~/.parlay; nothing in this file gets the chance.
      - name: Test
        env:
          HOME: ${{ runner.temp }}/go-home
        run: |
          mkdir -p "$HOME"
          for m in $GO_MODULES; do
            echo "::group::go test ./... ($m)"
            ( cd "$m" && go test ./... )
            echo "::endgroup::"
          done

      # `go build ./...` writes a binary next to any main package that is not
      # gitignored. tools/relay/relay is 9.6 MB and was exactly that — the
      # committed-binary PR the triage found. This asserts the working tree is
      # still clean after a full build, so a newly added main package cannot
      # reintroduce it: the check fixes itself as modules are added, which a
      # hardcoded filename list would not.
      - name: No build artifact may be left untracked
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::go build ./... produced files that are neither tracked nor gitignored:"
            git status --porcelain
            echo "Add the binary to .gitignore (see the existing"
            echo "packages/eval-engine/eval-engine and tools/cli/bin/ entries)."
            exit 1
          fi
          echo "working tree clean after a full build"

  # ── Bun workspace: packages/input, packages/client, packages/server,
  #    plus tools/gate-tag ───────────────────────────────────────────
  # packages/server has real test files but no "test" script
  # in package.json, so `bun test` is invoked directly. Every package is run
  # from inside its own directory: there is no root bunfig.toml, so the
  # happy-dom preload that packages/client and packages/input need is only
  # picked up from the package directory (see AGENTS.md).
  #
  # Known gap, deliberately NOT enforced here: tools/hooks/pre-commit imposes a
  # 250-line ceiling on staged .ts files. It is a staged-diff check rather than
  # a whole-tree one, so it does not map cleanly onto a CI job — a PR can be
  # perfectly mergeable while files it never touched sit over the limit. It is
  # named here (and in AGENTS.md) so that a contributor whose commit is rejected
  # by a hook they never installed on purpose can find the rule written down
  # instead of discovering it as an ambush.
  bun:
    name: Bun (test, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'

      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'tools/split-test/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # The root workspaces glob is packages/* only, so tools/split-test has
      # its own lockfile and needs its own install.
      - name: Install (workspace root)
        run: bun install --frozen-lockfile

      - name: Install (tools/split-test)
        run: bun install --frozen-lockfile
        working-directory: tools/split-test

      # HOME is redirected for the same reason as the Go job, and it is still
      # load-bearing rather than defensive. It used to be packages/cli's tests
      # that resolved join(homedir(), ".parlay", …) directly; those went with
      # the package in T-08, but packages/server keeps the requirement — its
      # paths.ts and the modules over it (session-channel, agent-context, tts,
      # tool-tailer, hook-tailer, debug-log) all resolve under homedir(), and
      # PARLAY_DATA_DIR does not cover every one of them. Without this redirect
      # the suite writes into a real developer's ~/.parlay on a self-hosted
      # runner.
      #
      # `tools` is in this loop but deliberately absent from the install steps
      # above: neither it nor tools/gate-tag has a package.json, so
      # `bun install --frozen-lockfile` there would fail. `bun test` in that
      # directory is the whole requirement — semver.test.ts imports only
      # `bun:test` and `./semver`, and lavish-poll.test.ts spawns the bridge as
      # a subprocess against Bun.serve stubs on ephemeral ports.
      #
      # This entry is `tools`, not `tools/gate-tag`, because a test file that CI
      # never runs is indistinguishable from one that has never run. Scoping it
      # to the one subdirectory that happened to have tests meant
      # tools/lavish-poll.test.ts was invisible to CI the moment it was added.
      # bun test skips node_modules, so tools/split-test's installed deps do not
      # get swept in.
      - name: Test
        env:
          HOME: ${{ runner.temp }}/bun-home
        shell: bash
        run: |
          mkdir -p "$HOME"
          roots="packages/input packages/client packages/server \
                 packages/webview packages/ccjuggler tools"

          # A test file under no root is not partially run — it is not run at
          # all, and this job still reports green, which is indistinguishable
          # from it having passed. packages/ccjuggler was in exactly that state:
          # six tests covering OAuth token resolution that CI had never once
          # executed. Checked before the loop so the failure names the gap
          # rather than surfacing as a confusing absence of output.
          uncovered=""
          while IFS= read -r f; do
            covered=""
            for r in $roots; do
              case "$f" in "$r"/*) covered=1; break ;; esac
            done
            [ -z "$covered" ] && uncovered="$uncovered $f"
          done < <(git ls-files '*.test.ts' '*.test.tsx')
          if [ -n "$uncovered" ]; then
            echo "::error::Test files exist under no root in this job's list, so they are NEVER RUN:"
            printf '  %s\n' $uncovered
            echo "Add the owning package to \$roots above."
            exit 1
          fi

          for p in $roots; do
            echo "::group::bun test ($p)"
            ( cd "$p" && bun test )
            echo "::endgroup::"
          done

      # Typecheck only where a tsconfig actually exists and resolves. Both use
      # the locked, package-local tsc rather than `bunx tsc`, which would fetch
      # TypeScript from the network at run time instead of using the pinned
      # version in the lockfile.
      - name: Typecheck (packages/input)
        run: ./node_modules/.bin/tsc --noEmit
        working-directory: packages/input

      - name: Typecheck (tools/split-test)
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json
        working-directory: tools/split-test

      # webview's own build script is `tsc && vite build`, so a tsc error here
      # is a broken build, not a style nit.
      - name: Typecheck (packages/webview)
        run: ./node_modules/.bin/tsc --noEmit
        working-directory: packages/webview

  # ── Hermetic shell harnesses ──────────────────────────────────────────────
  # Only the nine harnesses that were verified to be genuinely side-effect-free
  # are here. Seven were trial-run against a redirected HOME with the live
  # ~/.parlay/agents and ~/.treehouse snapshotted before and after, producing
  # zero drift in either. tools/hooks/hooks.test.sh meets the same bar: it
  # redirects HOME into its own mktemp scratch dir, stubs bun on PATH so no real
  # build can run, needs only git and bash, and names neither ~/.parlay nor
  # ~/.treehouse at all. bin/context-reset.test.sh does the same: it redirects
  # HOME, TMPDIR and PARLAY_AGENT_HOME into one mktemp root, stubs the handoff
  # CLI, and asserts the pid it resolved is its own fixture before any kill.
  # Everything else that runs as a shell script is excluded because it drives
  # live or macOS-only state or stands up a real server fixture — AGENTS.md
  # owns that "not covered" list and its per-entry reasons; do not re-enumerate
  # it here. The three nearest misses, for context:
  #
  #   tools/monitor/parlay-monitor.test.sh   — enrols over a relay control
  #       socket and spawns relay processes; touches live relay state.
  #   tools/relay/deploy/ensure-up.test.sh   — drives launchctl (macOS launchd).
  #   tools/relay/deploy/install.test.sh     — launchctl + plist/PlistBuddy.
  #
  # HOME is redirected here too, and PARLAY_SERVER is pointed at a closed port
  # so that any spawn path which somehow reached a network call fails fast
  # instead of registering against a live Pulse instance.
  shell:
    name: Shell harnesses (hermetic only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # HOME is set on this step rather than on the job, so that the checkout
      # above still runs with a real home directory.
      - name: Run hermetic harnesses
        env:
          HOME: ${{ runner.temp }}/shell-home
          PARLAY_SERVER: http://127.0.0.1:1
        run: |
          # bin/parlay-treehouse-guard.test.sh opens with a `command -v jq ||
          # exit 0` skip, which is right on a developer laptop and wrong here:
          # if jq ever left the runner image the harness would report success
          # having asserted nothing, and the gate would read green. The other
          # harnesses lean on git and curl the same way, and
          # bin/context-reset.test.sh needs python3 (it allocates a real pty to
          # reproduce the pane the handoff echo writes to). That one harness
          # also refuses to skip green when $CI is set — it errors instead — but
          # that is the belt, not the braces: the preflight is what names the
          # missing binary before any harness runs.
          # ubuntu-latest is a rolling image, so assert the dependencies rather
          # than assume them — a missing one must fail loudly, not silently pass.
          missing=""
          for b in git jq curl python3; do
            command -v "$b" >/dev/null 2>&1 || missing="$missing $b"
          done
          if [ -n "$missing" ]; then
            for b in $missing; do
              echo "::error::required binary '$b' is not on PATH; the shell harnesses would skip or fail vacuously without it"
            done
            exit 1
          fi

          mkdir -p "$HOME"
          # These build real throwaway git repositories; git refuses to commit
          # without an identity, and the redirected HOME has no gitconfig.
          git config --global user.email ci@example.invalid
          git config --global user.name  "parlay ci"
          for t in bin/parlay-spawn.templates.test.sh \
                   bin/parlay-spawn.integration.test.sh \
                   bin/parlay-spawn.quoting.test.sh \
                   bin/parlay-spawn.batch.test.sh \
                   bin/parlay-spawn.worktree.test.sh \
                   bin/parlay-treehouse-guard.test.sh \
                   bin/context-reset.test.sh \
                   tools/mechanic-dispatch/mechanic-dispatch.test.sh \
                   tools/hooks/hooks.test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

  # ── Repository hygiene ────────────────────────────────────────────────────
  # No toolchain needed, so this answers in seconds and catches two of the
  # three breakages the open-PR triage found on its own.
  hygiene:
    name: Hygiene (conflict markers, large files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # One of the open PRs committed conflict markers and did not compile.
      # This file is deliberately NOT excluded from its own scan — the workflow
      # must not be the one place the gate cannot see. The pattern below is
      # written so it cannot self-match: the regex source contains no run of
      # seven markers at the start of a line.
      #
      # git grep's three exit statuses are distinguished rather than collapsed
      # into if/else: 0 is "matches found", 1 is "clean", and anything else is
      # git itself failing. Treating that third case as clean is how a gate goes
      # vacuously green — the whole failure mode this workflow exists to remove.
      - name: No committed conflict markers
        run: |
          markers="$(mktemp)"
          set +e
          git grep -nIE '^(<{7}|={7}|>{7})( |$)' > "$markers"
          status=$?
          set -e
          case "$status" in
            0)
              echo "::error::committed merge-conflict markers:"
              cat "$markers"
              exit 1
              ;;
            1)
              echo "no conflict markers"
              ;;
            *)
              echo "::error::git grep exited $status: the conflict-marker scan did not run"
              cat "$markers"
              exit 1
              ;;
          esac

      # A 9.6 MB Go binary was committed on one of the open PRs. The largest
      # legitimately tracked file in this repo is AGENTS.md at ~75 KB, so a
      # 2 MiB ceiling is far above anything real and still catches a binary.
      #
      # Sizes come from `git ls-tree -l`, i.e. the tracked blob, not `stat` on
      # the worktree path. This repo tracks symlinks (CLAUDE.md,
      # packages/eval-engine/commands.json); `stat` follows them, so it would
      # measure whatever they point at — and under `set -e` a symlink whose
      # target is missing after checkout would abort the step with an opaque
      # "cannot stat" rather than a size verdict. A symlink's blob is just its
      # target string, which is what should be measured.
      #
      # The listing is written to a file rather than piped in from a process
      # substitution, whose exit status the `while ... done < <(...)` form never
      # consumes: a failing git ls-tree would feed the loop nothing and the gate
      # would announce a clean tree it never read. The scanned count is asserted
      # for the same reason — an empty listing is an unanswered question, not a
      # pass.
      - name: No oversized tracked files
        run: |
          limit=$((2 * 1024 * 1024))
          listing="$(mktemp)"
          if ! git ls-tree -r -l -z --full-tree HEAD > "$listing"; then
            echo "::error::git ls-tree failed: the tracked-file size scan did not run"
            exit 1
          fi
          fail=0
          scanned=0
          while IFS= read -r -d '' entry; do
            meta=${entry%%$'\t'*}
            path=${entry#*$'\t'}
            size=${meta##* }
            scanned=$((scanned + 1))
            # Gitlinks (submodule commits) report "-" instead of a byte count.
            [ "$size" = "-" ] && continue
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$path::$path is $size bytes, over the $limit byte limit"
              fail=1
            fi
          done < "$listing"
          if [ "$fail" -ne 0 ]; then
            echo "Committed build artifacts belong in .gitignore, not in git."
            exit 1
          fi
          if [ "$scanned" -eq 0 ]; then
            echo "::error::git ls-tree listed no tracked files at HEAD: the size scan proved nothing"
            exit 1
          fi
          echo "no tracked file exceeds $limit bytes ($scanned scanned)"
