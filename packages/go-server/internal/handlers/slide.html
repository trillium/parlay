<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Slides">
<link rel="manifest" href="/slide/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/slide/icon-180.png">
<title>Slide remote</title>
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#111; --btn:#1f6feb; --btn-fg:#fff; --alt:#555; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --alt:#6e7681; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:16px system-ui,sans-serif; touch-action:manipulation; -webkit-text-size-adjust:100%; }
  main { display:flex; flex-direction:column; height:100%; gap:12px; padding:16px; padding-top:max(16px, env(safe-area-inset-top)); padding-bottom:max(16px, env(safe-area-inset-bottom)); box-sizing:border-box; }
  button, a.deck, input { touch-action:manipulation; min-height:44px; }
  button { flex:1; font-size:2rem; border:0; border-radius:16px; background:var(--btn); color:var(--btn-fg); }
  button.prev { flex:.5; background:var(--alt); }
  button:disabled { opacity:.5; }
  #status { min-height:1.5em; text-align:center; }
  input { font-size:1rem; padding:10px; border-radius:8px; border:1px solid var(--alt); background:transparent; color:inherit; box-sizing:border-box; }
  a.deck { display:flex; align-items:center; justify-content:center; text-align:center; font-size:1.25rem; font-weight:700; color:var(--btn); padding:8px 0; box-sizing:border-box; }
</style>
</head>
<body>
<main>
  <a class="deck" href="https://voicefirst.dev/slides/" target="_blank" rel="noopener">Open slides</a>
  <input id="token" type="password" placeholder="token" autocomplete="off">
  <button id="next">Next &rarr;</button>
  <button id="previous" class="prev">&larr; Previous</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  var tok = document.getElementById('token'), st = document.getElementById('status');
  try { tok.value = localStorage.getItem('slideToken') || ''; } catch (e) {}
  // Pairing: the QR opens /slide#t=<token>. A fragment is never sent to the
  // server or logged; keep it in localStorage and strip it from the URL.
  var m = /[#&]t=([^&]+)/.exec(location.hash);
  if (m) {
    try { tok.value = decodeURIComponent(m[1]); localStorage.setItem('slideToken', tok.value); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  function send(direction) {
    try { localStorage.setItem('slideToken', tok.value); } catch (e) {}
    st.textContent = 'sending…';
    fetch('/api/chat/slide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok.value },
      body: JSON.stringify({ direction: direction })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        st.textContent = r.ok ? direction + ' queued' : (r.status + ' ' + (b.error || 'failed'));
      });
    }).catch(function (e) { st.textContent = 'network error: ' + e.message; });
  }
  ['next', 'previous'].forEach(function (d) {
    document.getElementById(d).addEventListener('click', function () { send(d); });
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/slide/sw.js', { scope: '/slide' }).catch(function () {});
  }
})();
</script>
</body>
</html>
