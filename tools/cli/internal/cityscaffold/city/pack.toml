# Root city pack for the parlay city (Pack Spec 2.0).
#
# Deployment glue only: this manifest exists to import the parlay pack. All
# parlay definitions (agents, formulas, orders, commands, doctor checks) live
# in packs/parlay/ so the pack stays reusable and importable by binding into
# any other city, independent of this city.toml.
#
# Spec: ~/code/gascity/docs/reference/specs/pack-spec.md (schema 2).

[pack]
name = "parlay-city"
schema = 2
description = "Root city pack for the parlay city. Deployment glue; all parlay definitions live in packs/parlay."

# The binding name qualifies every agent the import contributes: an agent
# `X` defined in packs/parlay/agents/X/ has runtime name `parlay.X`
# (pack-spec §2.5). Address imported agents by the qualified name.
[imports.parlay]
source = "packs/parlay"

# The builtin packs (core, bd) are deliberately NOT imported here. Both of
# the declarations this file used to carry broke the city for the gc that
# actually runs `parlay spawn` (robots-wdbvx), each in its own way:
#
#   * [imports.core] is a hard stop on any host whose GC_HOME carries gc's
#     legacy implicit-import bookkeeping — "city pack declares [imports.core]
#     which shadows the bootstrap implicit import(s) with the same name;
#     rename one side" — and those binaries supply core implicitly anyway, so
#     declaring it is both illegal and redundant;
#   * neither source resolves at all on 0.15.1.trillium, the fork build on
#     PATH: it predates config.resolveBundledSourceWithoutLock, so a bundled
#     V2 import falls through to the git-include cache and dies with "remote
#     include https://github.com/gastownhall/gascity.git#main is not cached at
#     <city>/.gc/cache/includes/…". `gc config show` and every `gc session
#     new` failed on that, which is what broke mechanic launches.
#
# gc init at a ref that supports bundled V2 imports writes these two imports
# and warns ("does not import required builtin pack(s) core, bd") when a city
# omits them; re-adding them is correct only together with a gc that resolves
# them offline. See city/README.md ("Builtin packs") for the full trade-off —
# the pinned ref and the production ref disagree here, and this file serves
# the one that runs.
